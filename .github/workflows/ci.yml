name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    # ubuntu-latest no longer carries Python 3.9, so that one job runs on the
    # last image that does. The package still supports 3.9 (pyproject.toml).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          - python: "3.9"
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[pictures]"
      - run: python tests/test_buttonboard.py
